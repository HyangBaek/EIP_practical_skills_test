<style>
:root{--bg:#f8fafc;--card:#fff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--pri:#2563eb;--pri-h:#1d4ed8;--pri-fg:#fff;--ok:#15803d;--ok-bg:#ecfdf3;--bad:#b91c1c;--bad-bg:#fef2f2;--mid:#a16207;--mid-bg:#fefce8;--code-bg:#0d1117;--chip:#f1f5f9}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--pri:#2f81f7;--ok:#3fb950;--ok-bg:#12261a;--bad:#f85149;--bad-bg:#2c1416;--mid:#d29922;--mid-bg:#2b2310;--chip:#21262d}}
:root[data-theme=dark]{--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--muted:#8b949e;--line:#30363d;--pri:#2f81f7;--ok:#3fb950;--ok-bg:#12261a;--bad:#f85149;--bad-bg:#2c1416;--mid:#d29922;--mid-bg:#2b2310;--chip:#21262d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);overflow-x:hidden;font:15px/1.6 -apple-system,"Noto Sans KR","Malgun Gothic",Roboto,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px calc(8px) ;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--pri);width:0}
main{max-width:760px;margin:0 auto;padding:14px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:13px;font-weight:600}
nav button.on{color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.b{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--chip);color:var(--muted);font-weight:600}
.b.ai{background:#efe3ff;color:#6e40c9}.b.type{background:#e0ecff;color:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .b.ai{background:#2b1f45;color:#c297ff}:root:not([data-theme=light]) .b.type{background:#132b4f;color:#79b8ff}}
:root[data-theme=dark] .b.ai{background:#2b1f45;color:#c297ff}:root[data-theme=dark] .b.type{background:#132b4f;color:#79b8ff}
.md{overflow-wrap:anywhere}.md p{margin:.5em 0}.md table{border-collapse:collapse;display:block;overflow-x:auto;margin:.6em 0}.md th,.md td{border:1px solid var(--line);padding:4px 8px;font-size:14px}
.md pre{background:var(--code-bg);color:#e6edf3;border-radius:10px;padding:12px 14px;overflow-x:auto;max-width:100%;font-size:13.5px;line-height:1.55;tab-size:4;-webkit-overflow-scrolling:touch}
.md code{font-family:"JetBrains Mono",Consolas,"D2Coding",monospace;font-size:.92em}.md :not(pre)>code{background:var(--chip);padding:1px 5px;border-radius:4px}
.md pre code.hljs{background:transparent;padding:0}
.md blockquote{margin:.5em 0;padding:.2em .8em;border-left:3px solid var(--line);color:var(--muted)}
textarea,input,select{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:70px;resize:vertical}textarea.mono{font-family:Consolas,"D2Coding",monospace;font-size:14px;min-height:110px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit;font-weight:600;min-height:48px;cursor:pointer}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}.btn.pri:active{background:var(--pri-h)}.btn.text{border-color:transparent;background:transparent;color:var(--muted)}.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;flex:0 0 auto}
.btn:disabled{opacity:.5}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;background:var(--chip);border-radius:99px;padding:5px 10px;border:0;color:var(--fg)}
.toggle.on{background:var(--mid-bg);color:var(--mid)}
.res{border-radius:10px;padding:12px;margin-top:12px;border:1px solid var(--line)}
.verdict{font-weight:800;font-size:15px;margin-bottom:6px}.v-ok{color:var(--ok)}.v-bad{color:var(--bad)}.v-mid{color:var(--mid)}
.res.ok{background:var(--ok-bg)}.res.bad{background:var(--bad-bg)}.res.mid{background:var(--mid-bg)}
h3.sec{font-size:13px;color:var(--muted);margin:14px 0 4px;letter-spacing:.02em}
.kw{display:flex;flex-wrap:wrap;gap:6px}.kw span{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px;font-weight:600}
.list .it{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.list .it .t{flex:1;min-width:0;font-size:14px}.list .it .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted);font-size:13px}.muted code{word-break:break-all}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--chip);border-radius:8px;padding:8px;text-align:center}.stats b{display:block;font-size:18px}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);background:#1b1f24;color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;z-index:20;max-width:90vw;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}@keyframes s{to{transform:rotate(360deg)}}
.hidden{display:none!important}
/* UX 개선: 포커스 표시, 풀이 화면 위계, 학습 홈 */
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 55%,transparent);outline-offset:2px}
#qBody{font-size:16px;line-height:1.75}#qBody p{margin:.6em 0}
.qprog{display:flex;align-items:center;gap:10px;margin-bottom:10px}.qprog .num{font-weight:800;font-size:15px;white-space:nowrap}.qprog .bar{flex:1;margin:0}
.qmeta{font-size:12.5px;color:var(--muted);margin-bottom:6px}
label.ans{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
body.solving nav{display:none}
body.solving .actbar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.actbar .btn.text{flex:0 0 auto;padding:8px 10px}
.judge{display:flex;gap:6px;flex:1.4}.judge .btn{flex:1}
.hero{padding:18px 16px}.hero h2{margin:0 0 4px;font-size:20px}.hero .sub{color:var(--muted);font-size:13.5px;margin-bottom:12px}
.cta{width:100%;min-height:54px;font-size:16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;text-align:left;font:inherit;color:var(--fg);cursor:pointer;min-height:76px}
.tile b{display:block;font-size:14.5px;margin-bottom:2px}.tile span{color:var(--muted);font-size:12.5px}.tile:disabled{opacity:.5}
details.cond>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700}details.cond>summary::-webkit-details-marker{display:none}
details.cond>summary:after{content:'▾';margin-left:auto;color:var(--muted)}details.cond[open]>summary:after{content:'▴'}
.condsum{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.empty-state{text-align:center;padding:22px 8px;color:var(--muted)}.empty-state b{display:block;color:var(--fg);margin-bottom:4px}
/* 풀기 화면 하단 고정 버튼 바 + 그 위로 펼쳐지는 정답 확인 시트 */
.actbar{position:fixed;left:0;right:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:760px;margin:0 auto}
.actbar .btn{flex:1;min-height:48px;padding:8px 6px}
.actbar .btn.sel-bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}.actbar .btn.sel-ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.sheet{position:fixed;left:0;right:0;z-index:6;max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.14)}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;user-select:none}
.sh-head .grip{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:36px;height:4px;border-radius:4px;background:var(--line)}
.sh-head b{flex:1}.sh-body{max-height:52vh;overflow:auto;padding:0 14px 12px;-webkit-overflow-scrolling:touch}
.sheet.collapsed .sh-body{display:none}
.sh-body .res{margin-top:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 12px;font:inherit;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--pri);border-color:var(--pri);color:#fff}.seg button:disabled{opacity:.4}.seg button small{font-weight:500;opacity:.8;margin-left:3px}
.sesbar{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px}.sesbar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}

.hero h2{font-size:24px;display:inline-block;background:var(--card);border:1px solid var(--ink);box-shadow:0 0 0 4px var(--pink);border-radius:99px;padding:4px 18px;margin:2px 0 10px 4px}
.hero h2 em{font-style:normal;color:var(--pri)}
.tile{position:relative;background:var(--card) var(--paper-lite);border:1px solid var(--ink);border-radius:16px;padding:14px 12px 12px 14px}
.tile::before{content:'';position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;border:1px solid var(--ink);background:var(--pink)}
.tile b{font-size:16px;color:var(--fg)}
.tile:active{transform:translateY(1px);box-shadow:none}
.btn{border:1px solid var(--ink2);border-radius:14px;background:var(--card);box-shadow:0 1px 0 rgba(92,72,66,.12)}
.btn.pri{background:var(--pri);border-color:var(--ink);color:var(--pri-fg)}
.btn:active{transform:translateY(1px);box-shadow:none}.btn.text{box-shadow:none}.btn:disabled{box-shadow:none}
.seg button{border:1px solid var(--ink2);background:var(--card)}.seg button.on{background:var(--pri);border-color:var(--ink);color:var(--pri-fg)}
.toggle{background:var(--card);border:1px solid var(--ink2)}.toggle::before{content:"";width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink2);background:var(--card);flex:0 0 auto}.toggle.on::before{background:var(--pri) url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 14 14%27%3E%3Cpath d=%27M3 7.5l2.5 2.5L11 4.5%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E");border-color:var(--pri)}#quickBtn::before{display:none}.toggle.on{background:var(--mid-bg)}
.b{background:var(--chip);color:var(--fg);border:1px solid var(--line);font-weight:400}
.b.type,.b.ai{border-color:transparent}
:root:not([data-theme=dark]) .b.type{background:var(--mint);color:#2f5f50}:root:not([data-theme=dark]) .b.ai{background:var(--pink);color:#8a3b36}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .b.type{background:var(--mint);color:#a9dcc8}:root:not([data-theme=light]) .b.ai{background:var(--pink);color:#f4b8b1}}
h3.sec{font-size:15px;color:var(--fg);display:flex;align-items:center;gap:6px}
h3.sec::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--pri)}
.kw span{background:var(--mint);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:400}
textarea,input,select{background:var(--card);border:1px solid var(--ink2);border-radius:12px}
#ans:not(.mono){line-height:30px;padding:4px 12px;min-height:96px;background:var(--card) repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px);background-attachment:local;background-position:0 4px}
label.ans{font-family:"Jua",sans-serif;font-weight:400;font-size:15px;color:var(--fg)}
.res{border:1px solid var(--ink);border-radius:14px}
.md pre{border-radius:14px;border:1px solid var(--ink);background:var(--code-bg)}
.md :not(pre)>code{background:var(--chip);border:1px solid var(--line)}
.md blockquote{border-left:4px solid var(--pink);color:var(--fg);background:var(--chip);border-radius:0 10px 10px 0}
.md th{background:var(--mint)}.md th,.md td{border-color:var(--ink)}
.stats div{background:var(--chip);border:1px solid var(--line);border-radius:12px}
.actbar{background:var(--card) var(--paper-lite);border-top:1px solid var(--ink)}
.sheet{background:var(--card) var(--paper-lite);border:1px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0}
.sh-head .grip{background:var(--ink);opacity:.5}
.toast{background:#5c4842;color:#fffcf5;border-radius:99px;padding:9px 16px}
.list .it{border-bottom:1.5px dashed var(--line)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--pri) 60%,transparent)}

html,body,header,nav,.card,.tile,.actbar,.sheet,.btn:not(.pri):not(.text),.seg button:not(.on){background-blend-mode:multiply;background-size:560px auto}
.btn:not(.pri):not(.text),.seg button:not(.on){background-image:var(--paper-lite)}
html{min-height:100%}
/* 고양이 캐릭터 */
.cat{display:block;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(92,72,66,.2));pointer-events:none;user-select:none;-webkit-user-drag:none}
.hero-top{display:flex;align-items:flex-end;gap:6px;position:relative}.hero-top>div{flex:1;min-width:0}
.hero-cat{height:124px;width:auto;margin:-10px -6px -4px 0;flex:0 0 auto}
.res-cat{float:right;height:92px;width:auto;margin:-6px -6px 4px 8px}
.empty-cat{height:140px;width:auto;margin:0 auto 10px}
.done-head{display:flex;align-items:center;gap:10px}.done-head>div{flex:1;min-width:0}.done-cat{height:120px;width:auto;flex:0 0 auto}
.done-msg{font-family:"Jua",sans-serif;font-size:17px;color:var(--fg);margin:2px 0 4px}
@media (max-width:370px){.hero-cat{height:104px}.res-cat{height:76px}}

/* 학습 모드 */
nav button{font-size:13px}
.scopes{display:flex;flex-direction:column;gap:6px}
.scope-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;color:var(--fg);cursor:pointer;min-height:56px}
.scope-row .no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:14px}
.scope-row .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px}.scope-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.scope-row .bar{display:block;margin-top:5px;height:5px}.scope-row .fq{flex:0 0 auto;font-size:12px;color:var(--muted);background:var(--chip);border-radius:99px;padding:2px 8px}
.clist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.concept{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.concept .ch{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}.concept .ch b{font-size:16px;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400}
.concept .en,.fcard .en{color:var(--muted);font-size:12.5px}.cbadges{margin-left:auto;display:flex;gap:4px}
.b.hot{background:var(--pink);color:var(--fg);border:0;font:inherit;font-size:11.5px;cursor:pointer}
.concept .cd{margin:6px 0;font-size:14.5px;line-height:1.65}.concept .kw span{font-size:12px}
.cp,.fc .cp{margin-top:6px;font-size:13px;color:var(--fg);background:var(--mid-bg);border-radius:8px;padding:6px 10px}
details.cgroup>summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}details.cgroup>summary::-webkit-details-marker{display:none}
details.cgroup>summary:after{content:'▾';margin-left:auto;color:var(--muted)}details.cgroup:not([open])>summary:after{content:'▸'}
.fc{min-height:240px;border:1px dashed var(--ink2);border-radius:16px;padding:20px 16px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;position:relative;background:var(--card)}
.fc.flipped{cursor:default;justify-content:flex-start;border-style:solid}
.fc-q{font-size:17px;line-height:1.75}.fc-t{font-family:"Jua",sans-serif;font-size:24px;color:var(--pri)}
.fc-hint{position:absolute;bottom:8px;right:12px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--pri);font:inherit;font-size:12.5px;text-decoration:underline;padding:0;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="ttl">정처기 실기 트레이너</h1>
    <button class="toggle" id="quickBtn" title="정답·키워드를 바로 보여줍니다">⚡ 빠른 확인</button>
  </div>
  <div class="stage"><span id="stageTxt">-</span><span id="accTxt"></span></div>
  <div class="bar"><i id="barI"></i></div>
</header>
<main>
  <section id="v-solve"></section>
  <section id="v-study" class="hidden"></section>
  <section id="v-wrong" class="hidden"></section>
  <section id="v-bank" class="hidden"></section>
  <section id="v-set" class="hidden"></section>
</main>
<nav>
  <button data-v="solve" class="on">풀기</button>
  <button data-v="study">학습</button>
  <button data-v="wrong">오답노트</button>
  <button data-v="bank">문제은행</button>
  <button data-v="set">설정</button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" class="hidden" multiple>

<script>
"use strict";
/* ================= 저장소(IndexedDB) ================= */
const DB = {
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('jcg',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise(res=>{try{const r=this.db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false)}catch(e){res(false)}})}
};

const DEFAULT_MODEL='gemini-3.8-flash';
const DEFAULT_SETTINGS = {autoRestore:true,apiKey:'',model:DEFAULT_MODEL,order:'seq',types:[],sources:[],quick:false,batch:3,focus:'auto',scope:'',theme:'auto',target:'new',count:0,qFolder:'questions',extraUrls:'',autoSync:true,loaded:{}};
const S = {session:null,reviewBack:null,files:{},importLog:[],importSum:'',bank:[],ai:[],progress:{},settings:{...DEFAULT_SETTINGS},cur:null,curMode:null,skip:new Set(),generating:false,view:'solve',reviewId:null};

async function load(){
  await DB.open();
  S.bank = (await DB.get('bank'))||[];
  S.ai = (await DB.get('ai'))||[];
  S.progress = (await DB.get('progress'))||{};

const RE_SRC=/(20\d{2})\s*년?\s*(?:도)?\s*(?:제\s*)?(\d)\s*회/;

/* 표 형식 기출: | 번호 | 문제(요약) | 정답 | 유형 | */
function splitRow(line){return line.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split(/(?<!\\)\|/).map(c=>c.replace(/\\\|/g,'|').trim())}

    const c=splitRow(line);

    const note=type==='코드'?'\n\n> 요약 문항: 원문 코드가 없어 정답(출력값·키워드)을 떠올리는 복습용입니다.':'';
    out.push(finishQ({source:src,no,body:body+note,answer,explanation:hdr.ei>=0?(c[hdr.ei]||''):'',keywords:[],type,lang,topic:cat,summary:true,origin:'bank'}));

function parseMarkdown(text,fileName){
  const tq=parseTableMd(text,fileName);if(tq.length>=3)return tq;

    .replace(/<summary>\s*([\s\S]*?)\s*<\/summary>/gi,'\n**$1**\n')
    .replace(/<\/?details[^>]*>/gi,'\n').replace(/<br\s*\/?>/gi,'\n');
  const L=text.split('\n'), code=[];let f=false;
  for(let i=0;i<L.length;i++){const fence=/^\s*(```|~~~)/.test(L[i]);code[i]=f||fence;if(fence)f=!f}
  // 문제 시작 패턴 선택: 3개 이상 매칭되는 첫 패턴
  let pat=null;
  for(const re of RE_Q){let c=0;for(let i=0;i<L.length;i++)if(!code[i]&&re.test(L[i])&&!RE_SRC.test(L[i]))c++;if(c>=3){pat=re;break}}
  if(!pat){for(const re of RE_Q.slice(0,2)){if(L.some((l,i)=>!code[i]&&re.test(l)&&!RE_SRC.test(l))){pat=re;break}}}

    const head=L[s.i].replace(pat,'').replace(/^[\s#*_\]]+|[\s*_]+$/g,'').trim();
    const blk=[];for(let i=s.i+1;i<end;i++)blk.push({t:L[i],c:code[i]});

    }else if(ei>=0){body=take(0,ei);expl=take(ei+1,blk.length)}

    body=body.replace(/\n-{3,}\s*$/,'').trim();answer=answer.replace(/\n-{3,}\s*$/,'').trim();expl=expl.replace(/\n-{3,}\s*$/,'').trim();
    if(head)body=`**${head}**\n\n`+body;

  }

}
const ENUM_RE=/^\s*(?:\d{1,2}\s*[.)](?!\d)|[①-⑳]|\([\dA-Za-zㄱ-ㅎ]{1,2}\)|[ㄱ-ㅎ]\s*[.):]|[A-Za-z]\s*[.):](?=\s))\s*/;
const cleanKw=x=>String(x).replace(/[*`_#>]/g,'').replace(ENUM_RE,'').replace(ENUM_RE,'').trim();
/* 키워드: 괄호 밖의 구분자로만 나누고, '한글(영문)'은 두 개로 분리, 보기 기호(ㄱ ① 1)만 있는 괄호는 버림 */
function splitTop(s){const out=[];let d=0,cur='';for(const ch of String(s)){if('([{'.includes(ch))d++;else if(')]}'.includes(ch))d=Math.max(0,d-1);if(d===0&&/[,，\/;·\n①-⑳]/.test(ch)){out.push(cur);cur='';continue}cur+=ch}out.push(cur);return out.flatMap(x=>x.split(/\s+또는\s+/))}
const KW_SYM=/^(?:[ㄱ-ㅎ]|[①-⑳]|\d{1,2}|[A-Za-z])$/;
function aliasSplit(p){
  p=cleanKw(p);if(!p)return [];
  if(/[\[\]{}%=<>+*\\]|\w\(\)/.test(p))return [p]; // 코드·수식은 그대로
  const m=p.match(/^(.*?)\s*\(([^()]+)\)\s*(?:패턴|방식|기법)?$/);if(!m)return [p];
  const outer=m[1].trim(),inner=m[2].split(/[,，\/]/).map(x=>x.trim()).filter(x=>x&&!KW_SYM.test(x));

const codeLike=x=>/[%=<>{}\[\]+*&|^]|\w\s*\/\s*\d/.test(x);

function detectType(body,answer){
  const b=body||'';
  if(/```\s*sql/i.test(b)||(/\bSQL\b|쿼리|질의문/.test(b)&&/\b(SELECT|UPDATE|DELETE|INSERT|CREATE|ALTER|DROP|GRANT|REVOKE)\b/i.test(b+answer)))return {type:'SQL',lang:'sql'};

  if(/\bdef\s+\w+\s*\(|\bprint\s*\(|\blambda\b/.test(b))return {type:'코드',lang:'python'};
  if(/서술|설명하시오|약술|기술하시오/.test(b)||stripMd(answer).length>90)return {type:'서술형',lang:''};

function autoKw(ans){const a=stripMd(ans);if(!a)return [];if(/```|\b(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|GRANT)\b|[;{}=%&<>\[\]]|\w\s*\/\s*\d/i.test(ans))return [];if(a.length<=80)return splitKw(a.replace(/[①-⑳]|\(\d+\)|^\s*\d+[\.\)]/gm,','));return [...String(ans).matchAll(/\*\*(.+?)\*\*/g)].map(m=>m[1]).slice(0,6)}

    id:x.id,source:x.source||x.exam||'',no:x.no??x.number??'',topic:x.topic||'',

/* 빈칸이 여러 개면 순서까지 본다: 순서대로 맞힌 개수로 점수, 내용은 다 있는데 순서가 다르면 알려줌 */
function orderedScore(partVars,u){
  if(!partVars.length)return {verdict:'오답',score:0};
  const pos=vs=>{let best=-1;for(const v of vs){const i=u.indexOf(v);if(i>=0&&(best<0||i<best))best=i}return best};
  const found=partVars.map(pos);const all=found.filter(i=>i>=0).length;
  let inOrder=0,last=-1;
  partVars.forEach(vs=>{let b=-1;for(const v of vs){const i=u.indexOf(v,last+1);if(i>=0&&(b<0||i<b))b=i}if(b>=0){inOrder++;last=b}});
  const n=partVars.length,r=inOrder/n;
  const res=r===1?{verdict:'정답',score:100}:r>0?{verdict:'부분정답',score:Math.round(r*100)}:{verdict:'오답',score:0};
  if(n>=2&&all===n&&inOrder<n)res.note='빈칸 순서가 다릅니다. 문제의 ①②… 순서대로 썼는지 확인하세요.';
  return res;
}
function autoGrade(q,user){
  const u=norm(user);if(!u)return {verdict:'오답',score:0};
  if(q.grade&&q.grade.length)return orderedScore(q.grade.map(p=>String(p).split('|').map(norm).filter(Boolean)),u);
  const ans=stripMd(q.answer);
  if(norm(ans)===u)return {verdict:'정답',score:100};
  let parts,mode='all';
  if(/또는|\|/.test(ans)){parts=ans.split(/또는|\|/);mode='any'}
  else if(/\s\/\s|\n|,|，/.test(ans))parts=ans.split(/\s*\/\s*|\n|[,，]/);
  else if(/[①-⑳]|\(\d\)|(^|\s)[ㄱ-ㅎ]\s*[\.:)]|(^|\n)\s*\d\s*[\.)]/.test(ans)){parts=ans.split(/[①-⑳]|\(\d\)|(?:^|\s)[ㄱ-ㅎ]\s*[\.:)]|(?:^|\n)\s*\d\s*[\.)]/)}
  else parts=ans.split(/[\/]/);

/* 모델 자동 전환: 선호 모델 → (한도 초과 시) 하위 모델로 내려갔다가, 선호 모델 대기 시간이 끝나면 자동으로 다시 올라감 */
const preferredModel=()=>((S.settings.model||'').trim()||DEFAULT_MODEL);
function rankModel(n){ // 낮을수록 먼저: 최신 버전 우선, 같은 버전은 flash → flash-lite → 그 외
  const v=parseFloat((n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const tier=/lite/.test(n)?2:/flash/.test(n)?1:/pro/.test(n)?4:3;
  return -v*10+tier+(/preview|exp/.test(n)?0.5:0);
}
async function modelChain(needList){
  const pref=preferredModel();
  if(S.settings.autoFallback===false)return [pref];
  if(needList&&S.settings.apiKey&&(!S.settings.modelList||Date.now()-(S.settings.modelListAt||0)>3*864e5)&&Date.now()-(S.modelListTry||0)>36e5){
    S.modelListTry=Date.now();try{S.settings.modelList=await listModels();S.settings.modelListAt=Date.now();await saveSet()}catch(e){}
  }
  const extra=(S.settings.modelList||[]).filter(n=>n!==pref&&/flash/.test(n)).sort((a,b)=>rankModel(a)-rankModel(b)).slice(0,4);
  return [pref,...extra.filter(n=>n!==pref)];
}
function aiLog(entry){try{S.aiLog=(S.aiLog||[]).concat([Object.assign({t:Date.now()},entry)]).slice(-20);DB.set('ailog',S.aiLog)}catch(e){}}
async function gemini(parts,opts={}){
  const key=S.settings.apiKey.trim();if(!key)throw new Error('설정에서 Gemini API 키를 입력하세요');
  if(!navigator.onLine)throw new Error('오프라인 상태라 AI를 쓸 수 없습니다. 기출 풀이와 자동 채점은 그대로 됩니다.');
  const pref=preferredModel();let chain=await modelChain(false),fetched=false,lastErr=null;
  for(let k=0;k<chain.length||(!fetched&&S.settings.autoFallback!==false);k++){
    if(k>=chain.length){chain=await modelChain(true);fetched=true;if(k>=chain.length)break}
    const model=chain[k];
    if(blockedUntil(model)>Date.now())continue;
    try{
      const out=await callModel(model,parts,opts,key);
      if(S.activeModel===model)renderHeader();else{S.activeModel=model;if(model!==pref)toast(`${pref} 한도 초과 → ${model}(으)로 자동 전환`,3500);else if(S.wasFallback)toast(`${pref}(으)로 다시 돌아왔습니다`,3000);S.wasFallback=model!==pref;renderHeader()}
      aiLog({model,ok:true,what:opts.what||''});
      return out;
    }catch(e){aiLog({model,ok:false,what:opts.what||'',msg:String(e.message||e).slice(0,200)});if(e.skip){lastErr=e;continue}throw e}
  }
  throw new Error(quotaMsgAll(chain,lastErr));
}
async function callModel(model,parts,opts,key){
  const {json=true,temperature=0.7,maxTokens=16384}=opts;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  const gc={maxOutputTokens:maxTokens};
  if(!/^gemini-[3-9]/.test(model))gc.temperature=temperature; // Gemini 3 이상은 기본 temperature 권장
  if(json)gc.responseMimeType='application/json';
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify({systemInstruction:{parts:[{text:'수식·화살표·기호는 LaTeX($...$, \\rightarrow 등)로 쓰지 말고 →, ⇒, ×, ≤, ≥, ≠, σ, π, ⋈ 같은 유니코드 문자로 직접 쓴다.'}]},contents:[{role:'user',parts}],generationConfig:gc})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){
    const msg=(j.error&&j.error.message)||('HTTP '+r.status);
    const block=async ms=>{S.settings.aiBlock=Object.assign({},S.settings.aiBlock,{[model]:Date.now()+ms});await saveSet();renderHeader()};
    if(r.status===429||/quota|RESOURCE_EXHAUSTED|rate.?limit/i.test(msg)){
      // 한도 초과(분당이든 하루든): 안내된 대기시간 동안 이 모델만 쉬게 하고 다음 모델로
      const m=msg.match(/retry in\s*(?:(\d+)h)?\s*(?:(\d+)m)?\s*(?:([\d.]+)s)?/i);
      await block(Math.max(m?((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0))*1000:60000,15000));
      const e=new Error(msg);e.skip=true;throw e;
    }
    if(r.status===404||/no longer available|not found|deprecated|not supported/i.test(msg)){
      // 종료된 모델: 권장 모델이 있으면 선호 모델로 교체, 이 모델은 하루 동안 건너뜀
      const sug=msg.match(/use\s+models\/([\w.\-]+)/i);
      await block(864e5);
      if(sug&&model===preferredModel()&&sug[1]!==model){S.settings.model=sug[1];await saveSet();toast(`기본 모델을 ${sug[1]}(으)로 바꿨습니다`,3500);const mi=$('#sModel');if(mi)mi.value=sug[1]}
      const e=new Error(msg);e.skip=true;throw e;
    }
    throw new Error(msg);
  }
  const c=j.candidates&&j.candidates[0];
  const t=((c&&c.content&&c.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
  if(!t)throw new Error('빈 응답 ('+((c&&c.finishReason)||'unknown')+')');
  if(!json)return t;
  const s=t.replace(/^\s*```(?:json)?/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(s)}catch(e){const m=s.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('JSON 파싱 실패')}
}
/* 한도는 모델마다 따로 계산되므로 대기 시간도 모델별로 기억 */
function blockedUntil(model){return ((S.settings.aiBlock||{})[model||preferredModel()])||0}
const fmtWait=ms=>{const h=Math.floor(ms/3600000),m=Math.max(1,Math.ceil(ms%3600000/60000));return `${h?h+'시간 ':''}${m}분`};
function quotaMsg(model){const ms=blockedUntil(model)-Date.now();return ms>0?`${model} 한도 초과 · 약 ${fmtWait(ms)} 뒤 사용 가능`:''}
function quotaMsgAll(chain,lastErr){

- 코드 문제는 실행 가능한 전체 코드로 쓰고, 출력을 한 줄씩 추적해 정답을 검증한다.
- SQL 문제는 테이블을 마크다운 표로 제시하고 결과/쿼리 정답이 명확해야 한다.
- 빈칸이 여러 개면 (①), (②)로 표시하고, answer는 ① 순서대로 쉼표로 나열한다. 보기를 쓰면 정답 순서와 다르게 섞는다.
- body에는 정답이나 정답이 드러나는 예시·'정답 작성 형식'을 넣지 않는다. explanation에 '[정답]'을 따로 쓰지 않는다.

  const dropped=list.filter(q=>blankMismatch(q)).length;list=list.filter(q=>!blankMismatch(q));
  if(dropped)aiLog({model:S.activeModel||'',ok:false,what:`범위 생성 검사 · ${label}`,msg:`빈칸·정답 수가 맞지 않는 ${dropped}문제 제외`});

/* ================= 출제 로직 ================= */
const LANGS=['C','Java','Python'];
function langOf(q){const l=String(q.lang||'').toLowerCase(),t=String(q.topic||'');if(l==='java'||/java/i.test(t))return 'Java';if(l==='python'||/python/i.test(t))return 'Python';if(l==='c'||/\(C\)|\bC언어/.test(t))return 'C';return ''}
function langOk(q){const L=S.settings.langs||[];if(!L.length)return true;const l=langOf(q);return l?L.includes(l):q.type!=='코드'} // 언어 선택은 프로그래밍 문항에만 적용, 언어를 모르는 코드 문항은 제외
function filtered(arr){const t=S.settings.types,s=S.settings.sources;return arr.filter(q=>(!t.length||t.includes(q.type))&&(!s.length||s.includes(q.source))&&langOk(q))}
function pendingBank(){return filtered(S.bank).filter(q=>!S.progress[q.id])}
function pendingAI(){return S.ai.filter(q=>!S.progress[q.id]&&langOk(q)&&(!S.settings.types.length||S.settings.types.includes(q.type)))}
function stage(){return pendingBank().length?1:2}
/* ---- 풀이 세션: 시작 화면에서 고른 조건으로 출제 ---- */
const TARGETS={new:'안 푼 기출',wrong:'틀린 문제',all:'전체 복습',ai:'AI 생성 문제',concept:'개념 퀴즈',list:'선택한 문제'};
function wrongList(){return filtered(allQs()).filter(q=>S.progress[q.id]&&S.progress[q.id].status==='wrong')}
function poolFor(target,ignoreSeen){
  const ss=S.session,seen=(!ignoreSeen&&ss)?ss.seen:new Set();
  const f=q=>!seen.has(q.id);
  if(target==='concept'||target==='list')return allQs().filter(q=>ss&&ss.only&&ss.only.has(q.id)).filter(f);
  if(target==='wrong')return (ss&&ss.only?allQs().filter(q=>ss.only.has(q.id)&&S.progress[q.id]&&S.progress[q.id].status==='wrong'):ss&&ss.allTypes?allQs().filter(q=>S.progress[q.id]&&S.progress[q.id].status==='wrong'):wrongList()).filter(f);
  if(target==='all')return filtered(S.bank).filter(f).filter(q=>summaryMode()!=='skip'||!rawSummary(q));
  if(target==='ai')return (ss&&ss.only?S.ai.filter(q=>ss.only.has(q.id)&&!S.progress[q.id]):pendingAI()).filter(f);
  return pendingBank().filter(f).filter(q=>summaryMode()!=='skip'||!rawSummary(q));
}
/* 요약 문항(원문 코드·본문 없음): 기본은 원문 있는 문제를 먼저 내고 요약 문항은 맨 뒤로 */
function rawSummary(q){return !!(q&&q.summary&&!q.restored)}
const SUMMARY_MODES={last:'뒤로 미루기',skip:'빼기',mix:'섞어서'};
function summaryMode(){return S.settings.summaryMode||'last'}
function startSession(o={}){
  const st=S.settings;
  S.session=Object.assign({target:st.target||'new',count:+st.count||0,order:st.order,done:0,ok:0,bad:0,quick:0,seen:new Set(),wrongIds:[],startTarget:st.target||'new'},o);
  if(o.target)S.session.startTarget=o.target;
  if(!o.only){S.settings.lastSession={target:S.session.target,order:S.session.order,count:S.session.count,allTypes:!!S.session.allTypes,types:st.types.slice(),sources:st.sources.slice(),langs:(st.langs||[]).slice(),quick:!!st.quick,at:Date.now()};saveSet()}
  pushSolveState();
  S.skip.clear();S.cur=null;S.reviewId=null;nextQuestion();
}
function endSession(){const ss=S.session;if(ss&&ss.done>0)return renderDone();S.session=null;S.cur=null;renderStart()}
async function nextQuestion(){
  S.reviewId=null;S.reviewBack=null;
  const ss=S.session;if(!ss)return renderStart();
  if(ss.count&&ss.done>=ss.count)return renderDone();
  let p=poolFor(ss.target).filter(q=>!S.skip.has(q.id));
  if(!p.length&&S.skip.size){S.skip.clear();p=poolFor(ss.target)}
  if(p.length&&(ss.target==='new'||ss.target==='all')&&summaryMode()==='last'){const main=p.filter(q=>!rawSummary(q));if(main.length)p=main}
  if(p.length){
    if(ss.order==='recent')p=p.slice().sort((a,b)=>((S.progress[b.id]||{}).last||0)-((S.progress[a.id]||{}).last||0));
    else if(ss.order==='often')p=p.slice().sort((a,b)=>wrongCount(b)-wrongCount(a)||((S.progress[b.id]||{}).last||0)-((S.progress[a.id]||{}).last||0));
    S.cur=ss.order==='random'&&ss.target!=='ai'?p[Math.floor(Math.random()*p.length)]:p[0];renderSolve();
    return;
  }
  if(ss.target==='new'){
    if(!S.settings.apiKey){ss.note='조건에 맞는 기출을 모두 풀었습니다. 설정에 Gemini API 키를 넣으면 이어서 AI 응용 문제가 나옵니다.';return renderDone()}
    ss.target='ai';toast('조건에 맞는 기출을 모두 풀었습니다 → AI 응용 문제로 넘어갑니다',3500);return nextQuestion()}
  if(ss.target!=='ai'||ss.only)return renderDone();
  S.cur=null;renderSolve();
  if(S.bank.length&&S.settings.apiKey){try{await generateBatch();if(S.session===ss)nextQuestion()}catch(e){toast('생성 실패: '+e.message,5000);renderSolve(e.message)}}
}
function countSession(q,status){
  const ss=S.session;if(!ss||S.reviewBack)return;
  if(!ss.seen.has(q.id)){ss.seen.add(q.id);ss.done++}
  else{ if(ss.last&&ss.last[q.id]==='correct')ss.ok--; if(ss.last&&ss.last[q.id]==='wrong')ss.bad--; if(ss.last&&ss.last[q.id]==='quick')ss.quick--; }
  ss.last=ss.last||{};ss.last[q.id]=status;
  if(status==='correct')ss.ok++;else if(status==='wrong'){ss.bad++;if(!ss.wrongIds.includes(q.id))ss.wrongIds.push(q.id)}else if(status==='quick')ss.quick++;
}

function mark(q,status,extra={}){

  S.progress[q.id]=p;S.lastStudy=Date.now();
  if(q.restored&&q.origin!=='ai'){const c=S.ai.find(a=>a.from===q.id&&a.body===q.body);if(c)S.progress[c.id]=Object.assign({},p)}
  if(q.origin==='concept'&&q.cid)studyMark(q.cid,status==='correct'?'know':status==='wrong'?'again':'unsure');
  saveProg();countSession(q,status);renderHeader();
}

  v.innerHTML=`<div class="card">${bar}${qHead(q)}<div class="md" id="qBody">${md(q.body)}</div>${rnote}
  ${quick?`<div class="res mid"><div class="verdict v-mid">정답</div><div class="md">${md(q.answer||'_정답 데이터 없음_')}</div>${q.keywords&&q.keywords.length?`<h3 class="sec">키워드</h3>${kwHtml(q)}`:''}</div>
    `
  :`<label class="ans" for="ans">내 답</label><textarea id="ans" class="${mono?'mono':''}" placeholder="${mono?'출력 결과나 코드를 그대로 입력':'답 입력'}  ·  시간 없으면 '바로 정답'" autocapitalize="off" autocomplete="off" spellcheck="false" aria-describedby="ansHelp"></textarea><div class="muted" id="ansHelp" style="margin-top:4px">빈칸이 여러 개면 ①②… 순서대로 쉼표나 / 로 구분해 쓰세요.</div>
    `}
  </div>
  <div class="sheet hidden" id="sheet"><div class="sh-head" id="shHead"><span class="grip"></span><b id="shTitle">정답 확인</b><span class="muted" id="shToggle">접기 ▼</span></div><div class="sh-body" id="res"></div></div>
  <div class="actbar" id="actbar">${quick?'<button class="btn" id="qConf">헷갈림 → 오답노트</button><button class="btn pri" id="qNext">다음 ▶</button>'
    :'<button class="btn text" id="qSkip">건너뛰기</button><button class="btn" id="qShow">정답 보기</button><button class="btn pri" id="qSub" disabled>제출</button>'}</div>`;
  document.body.classList.add('solving');
  placeBars();
  hl(v);
  const se=$('#sesEnd');if(se)se.onclick=()=>endSession();
  const rq=$('#regenQ');if(rq)rq.onclick=()=>regenQuestion(q,rq);
  const uq=$('#undoQ');if(uq)uq.onclick=async()=>{swapPrev(q);await saveQ(q);toast('이전 문제로 되돌렸습니다');renderSolve()};
  const sb=$('#sesBack');if(sb)sb.onclick=()=>afterAnswer();
  if(quick){
    if(!S.progress[q.id]||S.progress[q.id].status!=='wrong')mark(q,'quick');
    $('#qNext').onclick=()=>afterAnswer();
    $('#qConf').onclick=()=>{mark(q,'wrong',{user:''});toast('오답노트에 추가');afterAnswer()};
    return;
  }
  const ta=$('#ans');let sent=false;
  const qs=$('#qSub');ta.oninput=()=>{qs.disabled=!ta.value.trim()};
  ta.onfocus=()=>setTimeout(()=>{try{ta.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}},350);
  qs.onclick=()=>{if(sent||!ta.value.trim())return;sent=true;ta.readOnly=true;submit(ta.value)};
  $('#qShow').onclick=()=>{if(sent)return;sent=true;ta.readOnly=true;submit(ta.value&&!QUICK_RE.test(ta.value)?ta.value:'',true)};
  $('#qSkip').onclick=()=>{S.skip.add(q.id);afterAnswer()};
}
/* 하단 바·시트 위치를 내비게이션 높이에 맞춰 배치, 본문이 가려지지 않게 여백 확보 */
function placeBars(){
  const nav=document.querySelector('nav'),bar=S.view==='solve'?$('#v-solve .actbar'):S.view==='study'?$('#v-study .actbar'):null,sh=$('#sheet');if(!bar){document.querySelector('main').style.paddingBottom='';return}
  const nh=nav?nav.offsetHeight:0;bar.style.bottom=nh+'px';
  if(sh)sh.style.bottom=(nh+bar.offsetHeight)+'px';
  document.querySelector('main').style.paddingBottom=(nh+bar.offsetHeight+(sh&&!sh.classList.contains('hidden')?($('#shHead').offsetHeight+12):16))+'px';
}
window.addEventListener('resize',()=>placeBars());
function setSheet(open){const sh=$('#sheet');if(!sh)return;sh.classList.toggle('collapsed',!open);$('#shToggle').textContent=open?'접기 ▼':'펼치기 ▲';placeBars()}
const QUICK_RE=/바로\s*정답|시간\s*(이\s*)?없|정답만|빨리\s*정답|답만\s*보여/;
function afterAnswer(){if(S.reviewBack){const b=S.reviewBack;S.reviewBack=null;S.reviewId=null;S.cur=null;show(b);return}nextQuestion()}

function submit(user,reveal=false){
  const q=S.cur;
  if(QUICK_RE.test(user)){S.settings.quick=true;saveSet();const t=$('#ans');if(t)t.readOnly=false;toast('빠른 확인 모드 ON — 정답·키워드를 바로 표시합니다');return renderSolve()}
  const r=$('#res');let g=null;
  if(!reveal&&user.trim()&&isShortAnswer(q))g=autoGrade(q,user);
  const cls=g?(g.verdict==='정답'?'ok':g.verdict==='부분정답'?'mid':'bad'):'';
  const needAI=!reveal&&user.trim()&&!g;
  r.innerHTML=`<div class="res ${cls}">${cat(g?{ok:'happy',mid:'think',bad:'sad'}[cls]:reveal?'wow':'think','res-cat')}
    ${g?`<div class="verdict v-${cls}">${{정답:'✓ 정답',부분정답:'△ 부분 정답',오답:'✕ 오답'}[g.verdict]||g.verdict}${g.verdict==='부분정답'?` (${g.score}%)`:''} <span class="muted">자동 채점 · 맞음/틀림을 고른 뒤 다음으로</span></div>${g.note?`<div class="muted" style="color:var(--mid)">${esc(g.note)}</div>`:''}`:reveal?'<div class="verdict">정답 확인</div>':'<div class="verdict">채점 대기</div>'}
    ${reveal?`<div class="muted" style="margin-bottom:6px">정답 보기로 확인한 문제는 틀림으로 기록돼요. 알고 있었다면 '맞음'을 누르세요.</div>`:''}
    ${user.trim()?`<h3 class="sec">내 답</h3><div class="md"><pre><code class="${q.lang?'language-'+esc(q.lang):''}">${esc(user)}</code></pre></div>`:''}
    <h3 class="sec">정답</h3><div class="md">${md(q.answer||'_정답 데이터 없음 — AI 해설로 확인하세요_')}</div>
    ${q.keywords&&q.keywords.length?`<h3 class="sec">키워드</h3>${kwHtml(q)}`:''}
    ${q.origAnswer&&q.origAnswer!==q.answer?`<div class="muted">정답 표기 순서는 이 문제의 빈칸 순서에 맞췄습니다 (원래 표기: ${esc(q.origAnswer)})</div>`:''}
    ${q.restored&&q.origBody?`<h3 class="sec">원래 요약</h3><div class="muted">${esc(stripMd(q.origBody).replace(/요약 문항:.*$/,'').trim())}</div>`:''}
    <h3 class="sec">해설</h3><div class="md" id="expl">${q.explanation?md(q.explanation):(()=>{const d=findDonor(q,false);return d?`<div class="muted">같은 문제의 저장된 해설 (${esc(d.source)} ${esc(d.no)}번)</div>${md(d.explanation)}`:'<span class="muted">저장된 해설이 없습니다. 필요할 때만 아래 \'AI 해설 생성\'을 누르세요(요청 1회).</span>'})()}</div>
    <div id="aiBox"></div>
    <div class="row">${needAI?'<button class="btn sm" id="aiGrade">AI 채점</button>':''}<button class="btn sm" id="aiExp">${q.explanation?'AI 해설 다시':'AI 해설 생성'}</button></div>
  </div>`;
  hl(r);
  const sh=$('#sheet');sh.classList.remove('hidden');
  $('#shTitle').innerHTML=g?`<span class="v-${cls}">${{정답:'✓ 정답',부분정답:'△ 부분 정답',오답:'✕ 오답'}[g.verdict]||g.verdict}${g.verdict==='부분정답'?` (${g.score}%)`:''}</span> <span class="muted" style="font-weight:400">· 정답 확인</span>`:reveal?'정답 확인 <span class="muted" style="font-weight:400">· 틀림으로 기록돼요</span>':'채점 대기 <span class="muted" style="font-weight:400">· 정답과 비교해 맞음/틀림을 고르세요</span>';
  $('#shHead').onclick=()=>setSheet(sh.classList.contains('collapsed'));
  $('#actbar').innerHTML='<div class="judge" role="group" aria-label="결과 확정"><button class="btn" id="mOk" aria-pressed="false">✓ 맞음</button><button class="btn" id="mBad" aria-pressed="false">✕ 틀림</button></div><button class="btn pri" id="mNext">다음 문제 ▶</button>';
  setSheet(true);r.scrollTop=0;
  let status=g?(g.verdict==='정답'?'correct':'wrong'):(reveal?'wrong':null);
  const commit=()=>{if(status)mark(q,status,{user})};
  const showSel=()=>{const o=$('#mOk'),b=$('#mBad');if(!o)return;o.classList.toggle('sel-ok',status==='correct');b.classList.toggle('sel-bad',status==='wrong');o.setAttribute('aria-pressed',status==='correct');b.setAttribute('aria-pressed',status==='wrong')};showSel();
  $('#mOk').onclick=()=>{status='correct';showSel();toast('맞음으로 기록')};
  $('#mBad').onclick=()=>{status='wrong';showSel();toast('틀림으로 기록 → 오답노트')};
  let moved=false;
  $('#mNext').onclick=()=>{if(moved)return;if(!status&&!confirm('맞음/틀림을 고르지 않았습니다. 틀림으로 기록할까요?'))return;if(!status)status='wrong';moved=true;$('#mNext').disabled=true;commit();afterAnswer()};
  const ag=$('#aiGrade');
  if(ag)ag.onclick=async()=>{ag.disabled=true;ag.innerHTML='<span class="spin"></span> 채점 중';
    try{const j=await gemini([{text:`정보처리기사 실기 채점관으로서 수험자 답안을 채점하라. 실제 시험처럼 주요 용어·결과값이 정확한지 엄격히 본다. 코드/SQL은 문법 오류와 결과 일치 여부를 확인한다.
[문제]\n${q.body}\n[모범답안]\n${q.answer}\n[수험자 답안]\n${user}
JSON으로만: {"verdict":"정답|부분정답|오답","score":0~100,"feedback":"마크다운 피드백(틀린 부분과 이유, 2~6줄)","missing":["빠진 키워드"]}`}],{temperature:0.1,maxTokens:4096,what:'AI 채점'});
      status=j.verdict==='정답'?'correct':'wrong';showSel();
      const c=j.verdict==='정답'?'ok':j.verdict==='부분정답'?'mid':'bad';
      $('#aiBox').innerHTML=`<div class="res ${c}"><div class="verdict v-${c}">AI 채점: ${esc(j.verdict)} (${+j.score||0}점)</div><div class="md">${md(j.feedback||'')}</div>${j.missing&&j.missing.length?`<div class="muted">빠진 키워드: ${j.missing.map(esc).join(', ')}</div>`:''}</div>`;
      ag.remove();
    }catch(e){toast(e.message,4000);ag.disabled=false;ag.textContent='AI 채점'}};
  $('#aiExp').onclick=async e=>{const b=e.target;b.disabled=true;b.innerHTML='<span class="spin"></span> 해설 생성 중';
    if(q.summary&&!q.restored){ // 요약 문항: 요청 1회로 본문+해설을 함께 만들어 저장
      try{const n=await restoreBatch([q]);if(!n)throw new Error(restoreBatch.lastReject?`생성된 문제가 정답과 맞지 않아 저장하지 않았습니다(${restoreBatch.lastReject}). 다시 눌러 보세요.`:'생성 결과가 비어 있습니다');
        const qb=$('#qBody');if(qb){qb.innerHTML=md(q.body);hl(qb)}$('#expl').innerHTML=md(q.explanation||'');hl($('#expl'));b.textContent='AI 해설 다시';toast('문제 본문과 해설을 저장했습니다')}
      catch(err){toast(err.message,6000);b.textContent='AI 해설 생성'}
      b.disabled=false;return}
    try{const j=await gemini([{text:`정보처리기사 실기 강사로서 아래 문제의 정답과 상세 해설을 작성하라.
- 코드 문제: 변수/배열/출력 변화를 단계별 표로 추적
- SQL 문제: 절 실행 순서대로 중간 결과를 보여줌
- 이론 문제: 정의 → 구분 포인트(헷갈리는 유사 개념 비교) → 암기 팁
[문제]\n${q.body}\n[기존 정답]\n${q.answer||'(없음, 직접 풀어서 제시)'}
JSON으로만: {"answer":"정답(기존 정답이 있으면 그대로)","keywords":["2~5개"],"explanation":"마크다운 해설"}`}],{temperature:0.3,maxTokens:12000,what:'해설 생성'});
      if(!q.answer&&j.answer)q.answer=j.answer;if(j.keywords&&j.keywords.length&&(!q.keywords||!q.keywords.length))q.keywords=expandKw(j.keywords);q.explanation=sanitizeExpl(j.explanation||q.explanation);q.aiExp=true;await saveQ(q);
      $('#expl').innerHTML=md(q.explanation);hl($('#expl'));b.textContent='AI 해설 다시';
    }catch(err){toast(err.message,4000);b.textContent='AI 해설 생성'}b.disabled=false};
}

/* ================= 화면: 오답노트 ================= */
function wrongCount(q){return ((S.progress[q.id]||{}).history||[]).filter(h=>h.s==='wrong').length||1}
function renderWrong(){
  const ord=S.settings.wrongOrder||'recent';
  const L={recent:'최신순',seq:'회차순',often:'많이 틀린 순',random:'랜덤'};
  let list=allQs().filter(q=>S.progress[q.id]&&S.progress[q.id].status==='wrong');
  const byLast=(a,b)=>S.progress[b.id].last-S.progress[a.id].last;
  if(ord==='seq'){const idx=new Map(allQs().map((q,i)=>[q.id,i]));list.sort((a,b)=>idx.get(a.id)-idx.get(b.id))}
  else if(ord==='often')list.sort((a,b)=>wrongCount(b)-wrongCount(a)||byLast(a,b));
  else list.sort(byLast);
  const v=$('#v-wrong');
  if(!list.length){v.innerHTML=`<div class="card empty-state">${cat('smug','empty-cat')}<b>아직 오답이 없어요.</b>기출 문제를 풀어보세요. 틀린 문제는 여기에 모입니다.<div class="row"><button class="btn pri" id="wGo">기출 문제 풀기</button></div></div>`;$('#wGo').onclick=()=>{show('solve',true);startSession({target:'new'})};return}
  v.innerHTML=`<div class="card"><b>복습할 오답 ${list.length}문항</b>
    ${list.length?`<label class="f">다시 푸는 순서</label><div class="seg" id="wOrder">${Object.entries(L).map(([k,l])=>`<button data-v="${k}" class="${ord===k?'on':''}">${l}</button>`).join('')}</div>
    ${ord==='random'?'<p class="muted" style="margin:6px 0 0">랜덤은 다시 풀 때마다 순서가 새로 섞이고, 목록은 최신순으로 보입니다.</p>':''}${ord==='often'?'<p class="muted" style="margin:6px 0 0">틀린 횟수가 많은 순, 같으면 최근에 틀린 순입니다.</p>':''}
    <div class="row"><button class="btn pri" id="wAll">${L[ord]}으로 전체 다시 풀기 ▶</button></div>`:''}
  <div class="list">${list.map(q=>`<div class="it"><div class="t"><div><b>${esc(q.source)}${q.no?' '+esc(q.no)+'번':''}</b> · ${esc(q.type)}${wrongCount(q)>1?` · <span style="color:var(--bad)">${wrongCount(q)}회 틀림</span>`:''}</div><div class="muted">${esc(stripMd(q.body).slice(0,80))} · ${fmtD(S.progress[q.id].last)}</div></div><button class="btn sm pri" data-r="${q.id}" aria-label="${esc(q.source)} ${esc(q.no)}번 다시 풀기">다시 풀기</button></div>`).join('')||'<div class="empty">틀린 문제가 없습니다.</div>'}</div></div>`;
  v.querySelectorAll('#wOrder button').forEach(b=>b.onclick=()=>{S.settings.wrongOrder=b.dataset.v;saveSet();renderWrong()});
  v.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.cur=findQ(b.dataset.r);S.reviewId=S.cur.id;S.reviewBack='wrong';show('solve',true);renderSolve();pushSolveState()});
  const w=$('#wAll');if(w)w.onclick=()=>{show('solve',true);startSession({target:'wrong',order:ord,allTypes:true,count:0})};
}

/* ================= 화면: 문제은행 ================= */
let bankQ='',bankFile=null,bankTab='bank',aiKind='all';
function fileGroups(){
  const groups={};S.bank.forEach(q=>{const k=q.file||'';(groups[k]=groups[k]||[]).push(q)});
  return Object.entries(groups).map(([k,qs])=>{const m=S.files[k]||{};return {k,qs,name:k?(m.name||decodeURIComponent(k.split('/').pop())):'파일 정보 없음 (이전 버전)',kind:k?(m.kind||fileKind(k)):'-',at:m.at||0}}).sort((a,b)=>b.at-a.at);
}
const fmtD=t=>{if(!t)return '';const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`};
function renderBank(){
  const v=$('#v-bank');
  if(bankTab==='ai')return renderAIBank();
  if(!S.bank.length&&!S.ai.length){v.innerHTML=`<div class="card empty"><p><b>문제은행이 비어 있습니다.</b></p><p class="muted">기출은 설정 탭의 '기출 불러오기'에서 넣습니다.</p><div class="row"><button class="btn pri" id="bGoImp">기출 불러오기로 이동</button></div></div>`;$('#bGoImp').onclick=()=>goImport();return}
  const cnt={};S.bank.forEach(q=>cnt[q.type]=(cnt[q.type]||0)+1);
  const srcs=[...new Set(S.bank.map(q=>q.source))];const rows=fileGroups();
  if(bankFile!==null&&!rows.some(f=>f.k===bankFile))bankFile=null;
  const list=S.bank.filter(q=>(bankFile===null||(q.file||'')===bankFile)&&(!bankQ||(q.body+q.answer+q.source).toLowerCase().includes(bankQ.toLowerCase())));
  v.innerHTML=`${bankSeg()}<div class="card"><div class="stats"><div><b>${S.bank.length}</b>기출</div><div><b>${S.ai.length}</b>AI 생성</div><div><b>${rows.length}</b>파일</div></div>
    <p class="muted" style="margin:10px 0 0">${Object.entries(cnt).map(([k,n])=>`${k} ${n}`).join(' · ')} · 회차 ${srcs.length}개</p></div>
  <div class="card"><select id="bFile"><option value="__all">전체 파일 (${S.bank.length}문항)</option>${rows.map((f,i)=>`<option value="${i}" ${bankFile===f.k?'selected':''}>${esc(f.name)} (${f.qs.length})</option>`).join('')}</select>
    <input id="bSearch" placeholder="검색 (본문·정답·회차)" value="${esc(bankQ)}" style="margin-top:8px">

function extraList(){return String(S.settings.extraUrls||'').split('\n').map(x=>x.trim()).filter(Boolean).map(u=>{let url;try{url=new URL(u,location.href).href}catch(e){return null}return {name:decodeURIComponent(url.split('?')[0].split('/').pop()||url),url,ver:'',extra:true}}).filter(Boolean)}
function fileStatus(f){const L=S.settings.loaded||{};if((S.settings.excluded||{})[f.url])return 'excluded';if(!(f.url in L))return 'new';if(f.ver&&L[f.url]!==f.ver)return 'changed';return 'done'}

async function loadSources(files,log){

  for(const f of files){
    try{
      const r=await fetch(f.url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
      const blob=await r.blob();const isPdf=/\.pdf$/i.test(f.name);
      const file=new File([blob],f.name,{type:isPdf?'application/pdf':(blob.type||'text/plain')});
      const done=await importOne(file,log,{tag:f.url,replace:f.status==='changed',askProgress:false,noAI:!!f.auto});
      if(done){S.settings.loaded[f.url]=f.ver||'done';delete S.settings.excluded[f.url];ok++}
    }catch(err){log(`✕ ${esc(f.name)}: ${esc(err.message)}`)}

const SCOPE_NAMES={1:'요구사항 확인',2:'데이터 입출력 구현',3:'통합 구현',4:'서버프로그램 구현',5:'인터페이스 구현',6:'화면 설계',7:'애플리케이션 테스트 관리',8:'SQL 응용',9:'소프트웨어 개발 보안 구축',10:'프로그래밍 언어 활용',11:'응용 SW 기초 기술 활용',12:'제품소프트웨어 패키징'};
const BOX_DAYS=[0,1,2,4,8,16]; // 상자 1~5: '알아요'를 누를 때마다 한 칸 올라가고 다음 복습까지 일수가 늘어남
let _concepts=null,_cqs=null,_freq=null;
function concepts(){if(!_concepts)_concepts=CONCEPTS_BASE.concat((S.conceptsAI||[]).map(c=>Object.assign({ai:true},c)));return _concepts}
function resetConceptCache(){_concepts=_cqs=_freq=null}
function findConcept(id){return concepts().find(c=>c.id===id)}
const cnorm=s=>String(s||'').toLowerCase().replace(/[\s\-_·()（）\/.,]/g,'');
function conceptNames(c){const a=[c.t].concat(c.en||[]);return [...new Set(a.concat(a.map(x=>x.replace(/\(.*?\)/g,'').trim())).filter(x=>cnorm(x).length>=2))]}
// 기출 출제 횟수: 정답·키워드·본문에 용어가 나온 기출 문항 수
function conceptFreq(){if(_freq)return _freq;_freq={};const qs=S.bank.map(q=>cnorm(q.answer)+'|'+cnorm((q.keywords||[]).join(','))+'|'+cnorm(q.body).slice(0,400));
  for(const c of concepts()){const ns=conceptNames(c).map(cnorm).filter(n=>n.length>=2);_freq[c.id]=qs.filter(s=>ns.some(n=>s.includes(n))).length}return _freq}
function bankFor(c){const ns=conceptNames(c).map(cnorm).filter(n=>n.length>=2);return S.bank.filter(q=>{const s=cnorm(q.answer)+'|'+cnorm((q.keywords||[]).join(','));return ns.some(n=>s.includes(n))})}
function stOf(id){return S.study[id]||null}
function isDue(id,now=Date.now()){const s=stOf(id);return !!s&&s.next<=now}
function mastered(id){const s=stOf(id);return !!s&&s.box>=3}
function studyMark(id,res){ // res: 'know' | 'unsure' | 'again'
  const s=Object.assign({box:0,next:0,seen:0,ok:0},S.study[id]||{});
  s.seen++;s.last=Date.now();
  const H=3600000;
  if(res==='know'){s.box=Math.min(5,(s.box||0)+1);s.ok++;s.next=Date.now()+BOX_DAYS[s.box]*24*H-60000}
  else if(res==='again'){s.box=1;s.next=Date.now()}            // 오늘 다시
  else{s.box=Math.max(1,s.box||1);s.next=Date.now()+12*H}       // 애매: 반나절 뒤
  S.study[id]=s;saveStudy();
}
function maskTerm(c,text){let t=String(text||'');for(const n of conceptNames(c).sort((a,b)=>b.length-a.length)){if(n.length<2)continue;t=t.split(n).join('(    )')}return t}
// 개념 → 단답형 퀴즈 문항(채점은 기존 autoGrade 사용)
function conceptQs(){if(_cqs)return _cqs;_cqs=concepts().map(c=>({id:'cq_'+c.id,cid:c.id,origin:'concept',source:'개념 퀴즈',no:'',type:'단답형',lang:'',topic:SCOPE_NAMES[c.sc]||'',
  body:`다음 설명에 해당하는 용어를 쓰시오.\n\n> ${maskTerm(c,c.d)}${c.k.length?`\n\n힌트 키워드: ${maskTerm(c,c.k.slice(0,3).join(', '))}`:''}`,
  answer:c.t+(c.en&&c.en[0]&&c.en[0]!==c.t?` (${c.en[0]})`:''),grade:[conceptNames(c).join('|')],keywords:[c.t].concat((c.en||[]).slice(0,1)),
  explanation:`**${c.t}**${c.en.length?' · '+c.en.join(', '):''}\n\n${c.d}${c.k.length?`\n\n- 키워드: ${c.k.join(', ')}`:''}${c.p?`\n- ${c.p}`:''}`}));return _cqs}
function allQs(){return S.bank.concat(S.ai,conceptQs())}
function studyStats(list){const now=Date.now();return {n:list.length,m:list.filter(c=>mastered(c.id)).length,due:list.filter(c=>isDue(c.id,now)).length,seen:list.filter(c=>stOf(c.id)).length}}

let study={view:'home',sc:0,q:'',card:null};
function renderStudy(){
  const v=$('#v-study');document.body.classList.remove('solving');renderHeader();
  if(study.view==='cards')return renderCards();
  const all=concepts(),fq=conceptFreq(),st=studyStats(all),now=Date.now();
  const due=all.filter(c=>isDue(c.id,now));
  if(study.view==='scope'&&study.sc)return renderScope();
  const q=study.q.trim(),hits=q?all.filter(c=>cnorm(c.t+c.en.join()+c.d+c.k.join()).includes(cnorm(q))).slice(0,40):[];
  v.innerHTML=`<div class="card hero study-hero"><div class="hero-top"><div><h2>개념 <em>학습</em></h2>
      <div class="sub">출제기준 12개 항목, 개념 ${all.length}개가 들어 있어요. AI 요청 없이 오프라인으로 공부합니다.</div></div>${cat('think','hero-cat')}</div>
    <div class="stats"><div><b>${st.m}</b>외운 개념</div><div><b>${due.length}</b>오늘 복습</div><div><b>${all.length-st.seen}</b>새 개념</div></div>
    <div class="row"><button class="btn pri" id="sDue" ${due.length?'':'disabled'}>오늘 복습 ${due.length}장</button><button class="btn" id="sHot">빈출 개념 20장</button></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="sQuiz">개념 퀴즈 20문항</button></div></div>
  <div class="card"><input id="sSearch" placeholder="개념 검색 (예: 결합도, OSPF, 경계값)" value="${esc(study.q)}" autocomplete="off">
    ${q?`<div class="clist" style="margin-top:10px">${hits.length?hits.map(conceptHtml).join(''):'<p class="muted">찾는 개념이 없어요.</p>'}</div>`:''}</div>
  <div class="card"><b>출제범위별 학습</b><p class="muted" style="margin:2px 0 8px">막대는 외운 개념 비율, 오른쪽 숫자는 기출에 나온 횟수예요.</p>
    <div class="scopes">${Object.entries(SCOPE_NAMES).map(([n,name])=>{const cs=all.filter(c=>c.sc===+n),s=studyStats(cs),f=cs.reduce((a,c)=>a+(fq[c.id]||0),0);
      return `<button class="scope-row" data-sc="${n}"><span class="no">${n}</span><span class="nm">${esc(name)}<small>${s.m}/${s.n} 외움${s.due?` · 복습 ${s.due}`:''}</small><span class="bar"><i style="width:${s.n?Math.round(s.m/s.n*100):0}%"></i></span></span><span class="fq" title="기출 출제">${f}</span></button>`}).join('')}</div></div>`;
  $('#sDue').onclick=()=>startCards(due.map(c=>c.id),'오늘 복습');
  $('#sHot').onclick=()=>{const l=all.slice().sort((a,b)=>(!!stOf(a.id))-(!!stOf(b.id))||(fq[b.id]||0)-(fq[a.id]||0)).slice(0,20);startCards(l.map(c=>c.id),'빈출 개념')};
  $('#sQuiz').onclick=()=>startConceptQuiz(all,'전체');
  const si=$('#sSearch');si.oninput=()=>{study.q=si.value;clearTimeout(si._t);si._t=setTimeout(()=>{renderStudy();const n=$('#sSearch');n.focus();n.setSelectionRange(n.value.length,n.value.length)},300)};
  v.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{study.view='scope';study.sc=+b.dataset.sc;renderStudy();window.scrollTo(0,0)});

async function fetchMoreConcepts(sc){
  const have=concepts().filter(c=>c.sc===sc).map(c=>c.t);
  const si=scopeItems().find(x=>x.no===sc),scopeTxt=si?si.name+'\n'+si.lines.join('\n'):SCOPE_NAMES[sc];
  const arr=await gemini([{text:`정보처리기사 실기 출제기준 ${sc}. ${SCOPE_NAMES[sc]} 범위에서 시험에 나올 만한 개념을 정리하라.
[범위]\n${scopeTxt}
[이미 있는 개념 — 중복 금지]\n${have.join(', ')}
규칙: 위 목록에 없는 개념 15개. 실기 단답형으로 물을 수 있는 용어 위주. 정의는 한 문장, 사실만. LaTeX 금지.
출력: JSON 배열만. 각 원소 {"g":"묶음 이름","t":"한글 용어","en":["영문 또는 약어"],"d":"정의 한 문장","k":["키워드",...],"p":"암기 포인트(없으면 빈 문자열)"}`}],{temperature:0.4,maxTokens:16384,what:'개념 보강'});
  const list=(Array.isArray(arr)?arr:[]).filter(x=>x&&x.t&&x.d&&!have.includes(x.t)).map(x=>({id:'ca'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),sc,g:String(x.g||'AI 보강'),t:String(x.t),en:[].concat(x.en||[]).map(String).filter(Boolean),d:String(x.d),k:[].concat(x.k||[]).map(String).filter(Boolean),p:String(x.p||'')}));
  if(!list.length)throw new Error('새 개념을 받지 못했어요. 잠시 뒤 다시 눌러 보세요.');
  S.conceptsAI=(S.conceptsAI||[]).concat(list);await DB.set('concepts_ai',S.conceptsAI);resetConceptCache();return list.length;
}

  $('#sScan').onclick=()=>openScan($('#scanBox'));
  $('#sPick').onclick=()=>pickFiles();
  $('#sPaste').onclick=()=>$('#pasteBox').classList.toggle('hidden');
  $('#pasteGo').onclick=async()=>{const t=$('#pasteTa').value;const qs=parseMarkdown(t,'붙여넣기');const d=new Date();S.importLog=[];const before=S.bank.length;
    const n=putQuestions(qs,'paste:'+d.getTime(),false,`붙여넣기 ${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`);await saveBank();
    bankLog(`${qs.length?'✓':'✕'} 붙여넣기: ${qs.length}문항 인식, ${n}문항 추가${qs.length?'':' — 문제 번호(### 문제 1 / **문제 1.** 등)를 찾지 못했습니다'}`);finishImport(before)};
  v.querySelectorAll('[data-fv]').forEach(b=>b.onclick=()=>{bankFile=rows[+b.dataset.fv].k;show('bank')});
  v.querySelectorAll('[data-fd]').forEach(b=>b.onclick=async()=>{
    const f=rows[+b.dataset.fd];
    if(!confirm(`'${f.name}'에서 불러온 ${f.qs.length}문항을 삭제할까요?\n(풀이 기록은 남아 있어 다시 불러오면 이어집니다)`))return;
    const ids=new Set(f.qs.map(q=>q.id));S.bank=S.bank.filter(q=>!ids.has(q.id));
    if(f.k){delete S.files[f.k];if(/^https?:/.test(f.k)){S.settings.excluded[f.k]=true;delete S.settings.loaded[f.k];await saveSet()}await saveFiles()}
    if(S.cur&&ids.has(S.cur.id))S.cur=null;if(bankFile===f.k)bankFile=null;S.importLog=[];S.importSum='';
    await saveBank();toast(`${f.qs.length}문항 삭제`);renderSet();renderHeader()});
  const dBusy=async(btn,fn)=>{const t=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="spin"></span> '+t;try{await fn()}catch(err){toast(err.message,6000)}finally{btn.disabled=false;btn.textContent=t}};
  $('#dCid').onchange=e=>{s.driveClientId=e.target.value.trim();GDRIVE.token=null;sv()};
  $('#dAuto').onchange=e=>{s.driveAuto=e.target.checked;e.target.parentElement.classList.toggle('on',e.target.checked);sv()};
  $('#dUp').onclick=e=>dBusy(e.target,async()=>{const n=await driveBackup();toast(`Drive에 백업했습니다 (${Math.round(n/1024)}KB)`);renderSet()});
  $('#dDown').onclick=e=>dBusy(e.target,async()=>{if(!confirm('Drive 백업을 이 기기에 합칠까요? (이 기기 기록은 지워지지 않습니다)'))return;const r=await driveRestore();toast(restoreMsg(r),6000);renderSet();renderHeader()});
  $('#fUp').onclick=()=>shareBackupFile();
  $('#fDown').onclick=()=>$('#fIn').click();
  $('#fIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const r=await restoreBackup(JSON.parse(await f.text()));toast(restoreMsg(r),6000);renderSet();renderHeader()}catch(err){toast('불러오기 실패: '+err.message,6000)}};
  $('#bExp').onclick=()=>downloadText('jcg_bank.json',JSON.stringify({questions:S.bank,ai:S.ai,progress:S.progress},null,1));
  $('#bReset').onclick=async()=>{if(!confirm('풀이 기록(오답노트 포함)을 모두 지울까요?'))return;S.progress={};await saveProg();S.cur=null;S.session=null;toast('초기화 완료');renderSet();renderHeader()};
  $('#bDelAI').onclick=async()=>{if(!confirm('AI 생성 문제를 모두 삭제할까요?'))return;S.ai=[];await saveAI();toast('AI 문제 삭제');renderHeader()};
  $('#bDel').onclick=async()=>{if(!confirm('기출 문제은행을 모두 삭제할까요?'))return;S.bank=[];Object.keys(S.files).forEach(k=>{if(/^https?:/.test(k)){S.settings.excluded[k]=true;delete S.settings.loaded[k]}});S.files={};await saveFiles();await saveSet();bankFile=null;await saveBank();S.cur=null;S.session=null;S.importLog=[];S.importSum='';renderSet();renderHeader()};
  $('#sForget').onclick=()=>{s.loaded={};sv();toast('다음 확인 때 모든 파일이 새 파일로 표시됩니다')};
  $('#sKey').onchange=e=>{s.apiKey=e.target.value.trim();sv()};
  $('#sModel').onchange=e=>{s.model=e.target.value.trim()||DEFAULT_MODEL;sv()};
  $('#sFallback').onchange=e=>{s.autoFallback=e.target.checked;e.target.parentElement.classList.toggle('on',e.target.checked);sv();showChain()};
  const showChain=async()=>{const ch=await modelChain(false);$('#chainBox').innerHTML=s.autoFallback===false?'':'전환 순서: '+ch.map(m=>{const w=blockedUntil(m)-Date.now();return `<b>${esc(m)}</b>${w>0?` <span style="color:var(--mid)">(대기 ${fmtWait(w)})</span>`:''}`}).join(' → ')+(ch.length<2?' <span>(다른 모델 목록은 처음 한도 초과 때 자동으로 불러옵니다)</span>':'')};
  showChain();
  $('#sModels').onclick=async e=>{const b=e.target;b.disabled=true;try{const ms=await listModels();s.modelList=ms;s.modelListAt=Date.now();sv();showChain();$('#modelList').innerHTML=ms.map(m=>`<option value="${esc(m)}">`).join('');
    $('#modelBox').innerHTML=ms.length?ms.map(m=>`<span data-m="${esc(m)}" style="cursor:pointer;${m===s.model?'background:var(--pri);color:#fff':''}">${esc(m)}</span>`).join(''):'<span>사용 가능한 모델이 없습니다</span>';
    $('#modelBox').querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{s.model=x.dataset.m;$('#sModel').value=s.model;sv();toast('모델: '+s.model);$('#sModels').click()})}catch(err){toast('실패: '+err.message,5000)}b.disabled=false};
  $('#sFocus').onchange=e=>{s.focus=e.target.value;sv()};
  $('#sBatch').onchange=e=>{s.batch=Math.max(1,Math.min(10,+e.target.value||3));sv()};
  $('#sScope').onchange=e=>{s.scope=e.target.value;sv()};
  $('#sTheme').onchange=e=>{s.theme=e.target.value;applyTheme();sv()};
  $('#sTest').onclick=async e=>{e.target.disabled=true;try{const t=await gemini([{text:'"OK"라고만 답해'}],{json:false,temperature:0,maxTokens:256,what:'연결 테스트'});toast('연결 성공: '+t.trim().slice(0,30))}catch(err){toast('실패: '+err.message,5000)}e.target.disabled=false};
  $('#sGen').onclick=async e=>{e.target.disabled=true;e.target.innerHTML='<span class="spin"></span> 생성 중';try{await generateBatch()}catch(err){toast('실패: '+err.message,5000)}e.target.disabled=false;e.target.textContent='지금 AI 문제 생성'};
}
function applyTheme(){const t=S.settings.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ================= 내비게이션 ================= */
function show(view,keep){
  S.view=view;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  ['solve','study','wrong','bank','set'].forEach(x=>$('#v-'+x).classList.toggle('hidden',x!==view));
  if(view==='solve'&&!keep){if(!S.session&&!S.reviewBack)renderStart();else if(!S.cur||S.progress[S.cur.id]&&!S.reviewId)nextQuestion();else renderSolve()}
  if(view!=='solve'){document.querySelector('main').style.paddingBottom='';document.body.classList.remove('solving')}
  if(view==='study'){if(!keep&&study.view==='cards'&&(!study.card||study.card.i>=study.card.ids.length))study.view=study.sc?'scope':'home';renderStudy()}
  if(view==='wrong')renderWrong();if(view==='bank')renderBank();if(view==='set')renderSet();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('#quickBtn').onclick=()=>{S.settings.quick=!S.settings.quick;saveSet();toast(S.settings.quick?'빠른 확인 모드 ON':'기본 모드 (풀이 → 채점 → 해설)');if(S.view==='solve'){if(S.cur)renderSolve();else if(!S.session)renderStart()}renderHeader()};
window.addEventListener('online',()=>{renderHeader();toast('온라인으로 돌아왔습니다')});
window.addEventListener('offline',()=>{renderHeader();toast('오프라인입니다. 기출 풀이와 자동 채점은 계속 됩니다',3500)});
/* 풀이 중 뒤로 가기: 앱을 나가지 않고 풀이를 끝내거나 이전 화면으로 */
function pushSolveState(){try{if(!history.state||!history.state.solving)history.pushState({solving:1},'')}catch(e){}}
function leaveSolving(){if(S.reviewBack){afterAnswer();return true}if(S.session){endSession();return true}return false}
window.addEventListener('popstate',()=>{if(document.body.classList.contains('solving'))leaveSolving()});
window.onAndroidBack=()=>{if(document.body.classList.contains('solving'))return leaveSolving();if(S.view!=='solve'){show('solve');return true}return false};

(async()=>{await load();applyTheme();show('solve');autoSync().catch(()=>{})})();
if('serviceWorker' in navigator&&location.hostname!=='appassets.androidplatform.net'&&(location.protocol==='https:'||location.hostname==='localhost')){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__reloaded){window.__reloaded=true;location.reload()}})}
window.blankItems=blankItems;window.$=$;window.__jcg={concepts,conceptQs,study:()=>study,subjectOf,scopeItems,md,convertTex,splitKw,expandKw,parseMarkdown,autoGrade,detectType,normalizeJson,S};
</script>
